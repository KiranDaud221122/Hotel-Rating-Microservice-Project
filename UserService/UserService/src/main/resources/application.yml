  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  https://integrator-8521026.okta.com/oauth2/default
      client:
        registration:
          my-internal-client:
            provider: okta
            authorization-grant-type: client_credentials
            scope: internal
            client-id: 0oay94tqsdIElrdyf697
            client-secret: 3Ty857GLqOsA5geGrJIMnmKEl_zAIjp9eHxeH7jB3bjH1CRzHQZVdTvhS0w-E0mJ

        provider:
          okta:
            issuer-uri: https://integrator-8521026.okta.com/oauth2/default


  datasource:
    url: jdbc:mysql://localhost:3306/microservices
    username: root
    password: Kiran@2211
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      ratingHotelBreaker:
        register-health-indicator: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED

  retry:
    instances:
      ratingHotelRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException$InternalServerError
          - java.io.IOException

  ratelimiter:
    instances:
      ratingHotelRateLimiter:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 500ms


okta:
  oauth2:
    issuer: https://integrator-8521026.okta.com/oauth2/default
    audience: api://default