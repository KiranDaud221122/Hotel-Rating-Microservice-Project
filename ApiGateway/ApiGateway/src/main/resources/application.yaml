server:
  port: 8084

spring:
  application:
    name: APIGATEWAY

  cloud:
    gateway:
      routes:
        - id: USERSERVICE
          uri: lb://USERSERVICE
          predicates:
            - Path=/users/**
        - id: HOTELSERVICE
          uri: lb://HOTELSERVICE
          predicates:
            - Path=/hotels/**
        - id: RATINGSERVICE
          uri: lb://RATINGSERVICE
          predicates:
            - Path=/ratings/**

  security:
    oauth2:
      client:
        registration:
          okta:
            client-id: 0oay94tqsdIElrdyf697
            client-secret: 3Ty857GLqOsA5geGrJIMnmKEl_zAIjp9eHxeH7jB3bjH1CRzHQZVdTvhS0w-E0mJ
            scope:
              - openid
              - profile
              - email
              - offline_access
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          okta:
            issuer-uri: https://integrator-8521026.okta.com/oauth2/default

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

#okta configuration for api gateway

okta:
  oauth2:
    issuer: https://integrator-8521026.okta.com/oauth2/default
    audience: api://default
    client-id: 0oay94tqsdIElrdyf697
    client-secret: 3Ty857GLqOsA5geGrJIMnmKEl_zAIjp9eHxeH7jB3bjH1CRzHQZVdTvhS0w-E0mJ
    scopes: openid, profile, email, offline_access